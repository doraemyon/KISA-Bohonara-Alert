name: KISA security notices to Telegram

on:
  # GitHub's own scheduler is only a fallback because scheduled events can be
  # delayed or dropped. A reliable external scheduler should invoke
  # workflow_dispatch every minute for fast alerts.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram connection-test message"
        required: false
        default: false
        type: boolean
      send_extension_test:
        description: "Send an optional notice-extension test"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: kisa-security-notice-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check KISA RSS and notify Telegram
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTICE_EXTENSION_REPOSITORY: ${{ secrets.NOTICE_EXTENSION_REPOSITORY }}
          NOTICE_EXTENSION_TOKEN: ${{ secrets.NOTICE_EXTENSION_TOKEN }}
          NOTICE_EXTENSION_PUBLIC_BASE_URL: ${{ vars.NOTICE_EXTENSION_PUBLIC_BASE_URL }}
          SEND_TEST: ${{ inputs.send_test }}
          SEND_EXTENSION_TEST: ${{ inputs.send_extension_test }}
        run: python3 scripts/check_kisa.py

      # Persist IDs already delivered even if a later notification in the same
      # batch fails, preventing duplicate push notifications.
      - name: Save notice state
        if: ${{ always() && steps.check.outputs.state_changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update KISA notice state"
            git push
          fi
